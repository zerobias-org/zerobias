name: "@zerobias-org/zerobias-org"
version: "1.0.0"

# The meta-repo builds nothing — this stack exists so the meta-repo ROOT
# provides a zbb stack context. zbb vars are STACK-scoped (a slot alone
# injects only its ZB_SLOT* identity vars), so without this file every
# `zbb --slot <s> …` run from the meta-root — including
# `zbb --slot <s> exec claude` — silently got NO credentials and the
# ZeroBias MCPs failed at session start. With it, cwd inference works
# here exactly like in a content repo.
#
# No lifecycle/require blocks on purpose: nothing is built, tested, or
# published from the meta-root.
#
# ── Shared dev credentials — inherited, not redeclared ───────────────
# ZB_TOKEN / ZB_API_KEY / ZB_ORG_ID / ZB_PLATFORM_URL / KNOWLEDGE_MCP_URL /
# NPM_CONFIG_TAG live ONCE per slot on the shared `dev` stack
# (@zerobias-org/dev-stack, auto-pulled from the registry at
# `zbb stack add`) and are IMPORTED here — the same
# depends/imports/exports pattern the platform and hub stacks use to
# inherit Dana's env. scripts/setup-org-credentials.sh seeds the dev
# stack once per slot (run it yourself in a normal terminal; it prompts
# only for what's missing); `zbb --slot <s> --stack zerobias-org env get
# ZB_ORG_ID` then resolves transitively. `optional:` = an unseeded slot
# yields empty vars (exactly like an unseeded local declaration used to)
# instead of a hard resolve error.
# ⚠ Never `env set` these six on THIS stack: a per-stack override
# permanently shadows the import, so credential rotation on the dev
# stack stops propagating here (zbb never clobbers user overrides).
depends:
  dev:
    package: "@zerobias-org/dev-stack@^1.0.0"

imports:
  dev:
    optional: true
    vars:
      - ZB_TOKEN
      - ZB_API_KEY
      - ZB_ORG_ID
      - ZB_PLATFORM_URL
      - KNOWLEDGE_MCP_URL
      - NPM_CONFIG_TAG
