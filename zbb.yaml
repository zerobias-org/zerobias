name: "@zerobias-org/zerobias-org"
version: "1.0.0"

# The meta-repo builds nothing — this stack exists so the meta-repo ROOT
# provides a zbb stack context. zbb vars are STACK-scoped (a slot alone
# injects only its ZB_SLOT* identity vars), so without this file every
# `zbb --slot <s> …` run from the meta-root — including
# `zbb --slot <s> exec claude` — silently got NO credentials and the
# ZeroBias MCPs failed at session start. With it, cwd inference works
# here exactly like in a content repo, and
# scripts/setup-org-credentials.sh seeds this stack alongside the
# content-repo stacks (same creds on every stack, no drift).
#
# No lifecycle/require blocks on purpose: nothing is built, tested, or
# published from the meta-root.
env:
  # ── Org-first SDLC credentials (managed by setup-org-credentials.sh —
  # run it yourself in a normal terminal; it prompts only for what's
  # missing). Declared here so `zbb env set` works (undeclared vars are
  # a silent no-op).
  ZB_TOKEN:
    type: secret
    mask: true
    description: >-
      REGISTRY key — auths pkg.zerobias.org (npm view/publish, .npmrc
      interpolation). Must be a PROD-issued key while the registry
      accepts only prod keys.

  ZB_API_KEY:
    type: secret
    mask: true
    description: >-
      ORG key — org OWNER API key of the target org/env. Resolves the
      ${ZB_API_KEY} placeholders in .mcp.json (zb-knowledge headers) and
      the zb MCP 'env' profile at claude session start.

  ZB_ORG_ID:
    type: string
    description: >-
      Target org UUID. Resolves the ${ZB_ORG_ID} placeholder in
      .mcp.json (zb-knowledge dana-org-id header).

  ZB_PLATFORM_URL:
    type: string
    default: "https://app.zerobias.com/api"
    description: Platform API base of the target environment

  KNOWLEDGE_MCP_URL:
    type: string
    default: "https://api.app.zerobias.com/knowledge-mcp/mcp"
    description: >-
      Per-env zb-knowledge MCP endpoint (keys are per-env; the .mcp.json
      default is PROD, so non-prod slots need their own value —
      setup-org-credentials.sh derives it from ZB_PLATFORM_URL).

  NPM_CONFIG_TAG:
    type: string
    default: "dev"
    description: >-
      npm dist-tag for org-private rc publishes (npm 11 refuses
      prerelease publishes without one).
